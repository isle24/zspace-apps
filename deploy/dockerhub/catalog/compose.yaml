name: zspace-store
services:
  catalog:
    image: ${CATALOG_IMAGE:-isle204/zspace-store:2026.10.13-r2}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    labels:
      io.space-store.service: space-store
      io.space.role: catalog
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CATALOG_BIND_IP:-127.0.0.1}:${CATALOG_PORT:-18442}:18442"
    environment:
      SPACE_PUBLIC_ORIGIN: ${SPACE_PUBLIC_ORIGIN:?Set the public catalog HTTP(S) origin}
      SPACE_ADMIN_2FA_REQUIRED: ${SPACE_ADMIN_2FA_REQUIRED:-1}
      SPACE_IMAGE_CACHE_DEFAULT_BYTES: ${SPACE_IMAGE_CACHE_DEFAULT_BYTES:-5368709120}
      SPACE_DB_HOST: postgres
      SPACE_DB_USER: zstore
      SPACE_DB_NAME: zstore
      SPACE_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - catalog-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [default, database]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:18442/api/health >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
  bootstrap:
    profiles: [bootstrap]
    image: ${CATALOG_IMAGE:-isle204/zspace-store:2026.10.13-r2}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    user: 10001:10001
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      io.space-store.service: space-store
      io.space.role: bootstrap
    entrypoint: [/usr/local/bin/space-gateway]
    command: [--listen=127.0.0.1:18542, --data-dir=/data, --engine=disabled]
    volumes:
      - catalog-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:18542/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17
    platform: ${POSTGRES_PLATFORM:-linux/amd64}
    restart: unless-stopped
    labels:
      io.space-store.service: space-store
      io.space.role: database
    environment:
      POSTGRES_USER: zstore
      POSTGRES_DB: zstore
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zstore -d zstore"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10
networks:
  database:
    internal: true
volumes:
  catalog-data:
  postgres-data:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.env.postgres-password}
