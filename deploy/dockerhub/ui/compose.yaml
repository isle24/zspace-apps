name: zspace-ui
services:
  ui:
    image: ${UI_IMAGE:-isle204/zspace-ui:latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    user: 10001:10001
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      io.space-store.service: space-store
      io.space.role: ui
    ports:
      - "${UI_BIND_IP:-127.0.0.1}:${UI_PORT:-18436}:18436"
    environment:
      NAS_ORIGIN: ${NAS_ORIGIN:?Set the fixed official NAS origin}
      UI_PUBLIC_ORIGIN: ${UI_PUBLIC_ORIGIN:?Set the browser-visible UI origin}
      SPACE_STORE_ENDPOINT: ${SPACE_STORE_ENDPOINT:-}
    volumes:
      - ui-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:18436/healthz >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
volumes:
  ui-data:
