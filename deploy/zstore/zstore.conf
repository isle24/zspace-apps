map $http_x_forwarded_proto $zstore_external_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
server {
    listen 80;
    server_name zstore.2iwm.com;
    client_max_body_size 1m;
    proxy_cache off;
    location = /api/store/setup { return 403; }
    location / {
        proxy_pass http://127.0.0.1:18442;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $zstore_external_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
